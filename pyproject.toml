[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nilemonitor"
version = "0.1.0"
description = "Satellite + OSINT monitoring of human-made change on the Ethiopian Nile (GERD, Blue Nile basin)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pystac-client>=0.7.0",
    "rasterio>=1.3.9",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "folium>=0.16",
    "shapely>=2.0",
    "streamlit>=1.32",
    "plotly>=5.20",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]